appId: com.mileschu.dayboard
productName: DayBoard
copyright: Copyright © 2026 Miles Chu
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty's native binary and spawn-helper must live outside app.asar to be executable.
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: out/third-party-notices.txt
    to: third-party-notices.txt
  - from: LICENSE
    to: LICENSE.txt
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
mac:
  minimumSystemVersion: "14.0"
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: app-icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  binaries:
    - Contents/Resources/bin/reminders-helper
  notarize: false
  extendInfo:
    NSRemindersFullAccessUsageDescription: DayBoard shows your Apple Reminders on the dashboard and lets you complete or add reminders.
    NSRemindersUsageDescription: DayBoard shows your Apple Reminders on the dashboard and lets you complete or add reminders.
    NSCalendarsFullAccessUsageDescription: DayBoard shows the calendars you choose from the Calendar app, such as iCloud, and lets you add, edit or delete their events.
    NSCalendarsUsageDescription: DayBoard shows the calendars you choose from the Calendar app, such as iCloud, and lets you add, edit or delete their events.
    NSMicrophoneUsageDescription: Dictate messages to the Assistant. Audio is sent to OpenAI for transcription only when you use dictation.
# Mac App Store edition (`npm run package:mas`): sandboxed, App Store updates, no subscription
# CLIs, PTY or updater code in the bundle. mas-dev inherits these settings; the script passes
# the provisioning profile.
mas:
  hardenedRuntime: false
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.inherit.plist
  files:
    - "!node_modules/node-pty{,/**/*}"
    - "!node_modules/electron-updater{,/**/*}"
# Electron fuses, flipped in the Electron binary before signing, for every packaged build
# (release, beta, preview, test and QA), so the builds testers run match what ships.
# scripts/electron-fuses.mjs holds the same values: release and preview packaging read them back
# from the packaged app, and tests/electron-fuses.test.mjs fails when the two fall out of step.
# - runAsNode / enableNodeOptionsEnvironmentVariable off: ELECTRON_RUN_AS_NODE and NODE_OPTIONS
#   can no longer turn the signed app into a general Node runtime. DayBoard never relies on either:
#   the CLIs, MCP server and Reminders helper run as their own binaries or in-process.
# - enableCookieEncryption: Chromium cookies are encrypted at rest with the app's Keychain key.
# - enableEmbeddedAsarIntegrityValidation + onlyLoadAppFromAsar: app code loads only from the
#   app.asar whose hash electron-builder writes into Info.plist.
# - enableNodeCliInspectArguments stays on: the release and beta workflows smoke-test the signed
#   app with Playwright, which attaches through --inspect. See docs/proposals/electron-fuses.md.
# - grantFileProtocolExtraPrivileges stays on: DayBoard's windows load from file://.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Electron's SHA-256 checksums, copied from node_modules/electron/checksums.json. With them,
# @electron/get still verifies the Electron zip but no longer downloads SHASUMS256.txt from GitHub
# on every build (it skips its cache for that file), which failed packaging with 504s on
# 2026-11-09. unsafelyDisableChecksums: false keeps verification on and selects the option form
# that passes checksums through to @electron/get; adding mirrorOptions here would drop them.
# tests/electron-download.test.mjs checks both and fails when the pins fall out of step with the
# installed Electron.
electronDownload:
  unsafelyDisableChecksums: false
  checksums:
    electron-v44.10.0-darwin-arm64.zip: 8e9f6041d3aa62229332b033d0390fd213a9b10cd078163f3f5fe988ee91baf7
    electron-v44.10.0-mas-arm64.zip: b05139de1e28bb05a449eeb0da1ec6a0c382a503a3af54dec9f5cff2bc1be164
# Release feed for electron-updater. Config only: `npm run dist` passes --publish never.
publish:
  provider: github
  owner: miles-chu10
  repo: dayboard
