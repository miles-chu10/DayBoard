name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # Offline fixtures replace Electron and providers. The native Swift fixture runs
      # on macOS only; this job never needs account credentials or a local app installation.
      - run: npm ci --include=dev --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  beta-package:
    name: Beta app, DMG and ZIP configuration
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      # Electron, its SHASUMS256.txt and electron-builder's tools come from GitHub releases.
      # Keeping them between runs means a GitHub download outage can't fail this job.
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci --include=dev
      - name: Seed existing artifacts for the isolation regression
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          const { version } = JSON.parse(await readFile("package.json", "utf8"));
          for (const file of [
            "out/main/index.js",
            `release/DayBoard-${version}-arm64.dmg`,
            `release/DayBoard-${version}-arm64-mac.zip`,
            "resources/bin/reminders-helper",
          ]) {
            await mkdir(path.dirname(file), { recursive: true });
            await writeFile(file, "existing artifact preservation sentinel\n", { flag: "wx" });
          }
          NODE
      # Synthetic client only; no credential access, uploads, releases or live sign-in.
      # A 5xx from a GitHub release download inside @electron/get crashes the build before
      # electron-builder's own download retry runs, so retry the test for that error only.
      # Any other failure fails the job on the first attempt.
      - name: Run npm run test:packaging
        shell: bash
        run: |
          log="$RUNNER_TEMP/packaging.log"
          for attempt in 1 2 3; do
            if npm run test:packaging 2>&1 | tee "$log"; then exit 0; fi
            grep -qE 'HTTPError: Response code 5[0-9]{2}' "$log" || exit 1
            echo "::warning::A GitHub download answered 5xx on attempt $attempt of 3."
            sleep 30
          done
          exit 1
  billing:
    name: Offline Stripe license service tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: billing/package-lock.json
      - run: npm --prefix billing ci --include=dev
      - run: npm --prefix billing run typecheck
      - run: npm --prefix billing test
